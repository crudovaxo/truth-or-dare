<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0a1a">
  <title>Truth or Dare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast"></div>

  <!-- HOME -->
  <main id="home" class="view">
    <div class="hero">
      <div class="logo">🎭</div>
      <h1>Truth or Dare</h1>
      <p class="sub">Play with friends, from anywhere.</p>
    </div>

    <section class="card">
      <label for="nick">Your nickname</label>
      <input id="nick" maxlength="20" placeholder="e.g. Rohan" autocomplete="off">
      <label>Pick an avatar</label>
      <div id="avatars" class="avatars"></div>
    </section>

    <section class="card">
      <label>Game mode (for a room you create)</label>
      <div class="modes">
        <button type="button" class="mode" data-mode="random"><b>🎲 Random</b><span>The app picks who goes next</span></button>
        <button type="button" class="mode" data-mode="sequential"><b>🔁 In order</b><span>One player after another</span></button>
      </div>
      <button id="btnCreate" class="primary">➕ Create a room</button>
      <div class="or"><span>or join a friend's room</span></div>
      <input id="code" maxlength="6" placeholder="ROOM CODE" autocapitalize="characters" autocomplete="off">
      <button id="btnJoin" class="secondary">Join room</button>
      <button id="btnRejoin" class="ghost hidden"></button>
    </section>
  </main>

  <!-- ROOM -->
  <main id="room" class="view hidden">
    <header class="roomhead">
      <div>
        <div class="small">Room code</div>
        <div id="roomCode" class="code"></div>
      </div>
      <div class="headbtns">
        <button data-act="copy" class="secondary">📋 Code</button>
        <button data-act="share" class="secondary">🔗 Invite</button>
      </div>
    </header>
    <div id="levelBadge" class="lvlbadge"></div>

    <section id="gameBox" class="card game"></section>
    <section id="hostBox" class="card hidden"></section>

    <section class="card">
      <h2>👥 Players</h2>
      <div id="playersBox"></div>
    </section>

    <button data-act="leave" class="ghost">Leave room</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
